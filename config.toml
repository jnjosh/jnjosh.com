baseurl = "https://jnjosh.com/"
title = "internet weblog"
theme = "internet-weblog-2"

disableAliases = true

[services.rss]
  limit = 20

[pagination]
  disableAliases = true

[caches.getresource]
  maxAge = "4h"

[params]
  handle = "@jnjosh"
  description = "Internet weblog of Software (Mac, iOS, Web) Developer, Josh Johnson."
  mainSections = ["workshop", "studio"]
  migratedBefore = 2026-08-12
  [params.glass]
    postsURL = "https://glass.photo/api/v2/users/jnjosh/posts"
    profileURL = "https://glass.photo/jnjosh"
  [params.author]
    Handle = "jnjosh"
    FirstName = "Josh"
    LastName = "Johnson"
    Location = "Raleigh, NC"

[params.footer]
  greeting = "Hi, [I'm Josh](/about/)"
  bio = """
I'm an Engineering Manager at [Adobe](https://adobe.com), a [photographer](https://glass.photo/jnjosh), learning to be a [musician](https://on.soundcloud.com/VqAdiOOr6Yjy8f8MDA), and [learning watchmaking](/workshop/posts/elgin-watch/).
See what else I'm [doing now](/now/).
"""
  followIntro = "Follow me on"
  colophon = "Made in Raleigh, NC"

  [[params.footer.social]]
    name = "Mastodon"
    url = "https://mastodon.social/@jnjosh"
    rel = "me"
  [[params.footer.social]]
    name = "Instagram"
    url = "https://instagram.com/jnjosh"
  [[params.footer.social]]
    name = "GitHub"
    url = "https://github.com/jnjosh"
    rel = "me"

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[privacy]
  [privacy.youtube]
    privacyEnhanced = true
  [privacy.vimeo]
    enableDNT = true

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[outputs]
  home = ["HTML", "RSS", "REDIRECTS"]
